<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111a2c">
<title>My English Bank — Google Sheets</title>
<style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#19243a;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}header{background:#111a2c;color:#fff;padding:28px max(18px,calc((100vw - 940px)/2))}header small{color:#a9bcff;letter-spacing:.12em;font-weight:800}h1{margin:6px 0;font-size:clamp(30px,5vw,42px)}header p{color:#aab8cc;margin:0}main{max-width:940px;margin:auto;padding:22px 16px 80px}.panel,.card{background:#fff;border:1px solid #e2e7f0;border-radius:20px;box-shadow:0 7px 20px #15213a0b}.panel{padding:20px;margin-bottom:20px}.panel h2{margin:0 0 15px;font-size:20px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.end{justify-content:flex-end}.toolbar{margin:20px 0}.toolbar input{flex:1;min-width:180px}.btn{border:0;border-radius:12px;padding:11px 15px;background:#e9eef8;color:#30436e;font-weight:750}.btn.primary{background:#4d67df;color:white}.btn.danger{background:#fff0f1;color:#b23442}.btn:disabled{opacity:.5;cursor:wait}input,textarea{width:100%;background:#fff;border:1px solid #d9e0ec;border-radius:12px;padding:12px;font-size:16px;color:#19243a}input:focus,textarea:focus{outline:3px solid #c0cdff}textarea{min-height:74px;resize:vertical}label{display:block;font-size:13px;font-weight:700;color:#62718b;margin:0 0 6px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.example{padding:15px 0;border-top:1px solid #e8edf4}.examples{margin-top:18px}.hint{color:#7886a0;font-size:12px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:15px}.card{padding:21px;min-width:0}.card h3{font-size:22px;margin:7px 0;overflow-wrap:anywhere}.meaning{color:#697790;white-space:pre-wrap}.sample{border-top:1px solid #edf0f5;margin-top:14px;padding-top:14px}.tag{color:#697ad0;font-size:11px;font-weight:800;letter-spacing:.1em}.en{font-weight:700;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}.ko{color:#697790;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}.actions{margin-top:18px}.hidden{display:none!important}.empty{border:2px dashed #d9e1ee;padding:42px 18px;text-align:center;border-radius:17px;color:#76849b}.status{font-size:12px;font-weight:700;color:#7886a0}.status.ok{color:#168361}.status.bad{color:#b23442}.footer{margin-top:20px;font-size:12px;color:#77869c}#flash{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#172139;color:#fff;padding:12px 20px;border-radius:12px;z-index:5;max-width:calc(100vw - 30px)}@media(max-width:600px){.fields{grid-template-columns:1fr}.panel{padding:16px}.toolbar button{flex:1}}
</style>
</head>
<body>
<header><small>PERSONAL VOCABULARY JOURNAL</small><h1>My English Bank</h1><p></p></header>
<main>
 <section class="panel" id="loginPanel"><h2>Google Sheets 연결</h2><div class="fields"><div><label for="pass">Apps Script 비밀번호</label><input id="pass" type="password" autocomplete="off" placeholder="APP_PASSWORD 입력"></div><div class="row" style="align-items:end"><button id="connect" class="btn primary" type="button">연결하기</button><span id="status" class="status">연결 전</span></div></div><p class="hint">비밀번호는 브라우저 메모리에만 보관하고, GitHub 코드나 localStorage에는 저장하지 않습니다.</p></section>
 <div class="toolbar row"><input id="search" type="search" placeholder="단어, 뜻, 예문 검색" aria-label="검색"><button id="new" class="btn primary" disabled>+ 새 표현</button><button id="reload" class="btn" disabled>새로고침</button><button id="export" class="btn" disabled>백업 저장</button><button id="importButton" class="btn" disabled>백업 불러오기</button><input id="importFile" type="file" accept=".json,application/json" class="hidden"></div>
 <section id="editor" class="panel hidden"><h2 id="editorTitle">새 표현</h2><form id="entryForm"><div class="fields"><div><label for="phrase">영어 단어·숙어 *</label><input id="phrase" required maxlength="250" placeholder="예: On my own merits"></div><div><label for="meaning">한국어 뜻 (선택)</label><input id="meaning" maxlength="500" placeholder="예: 내 실력으로"></div></div><div id="examples" class="examples"></div><div class="row between"><button id="addExample" class="btn" type="button">+ 예문 추가 (최대 3개)</button><span class="hint">영어 예문·한국어 번역 모두 선택</span></div><div class="row end" style="margin-top:18px"><button id="cancel" type="button" class="btn">취소</button><button id="save" type="submit" class="btn primary">저장하기</button></div></form></section>
 <div class="row between" style="margin:20px 2px"><strong>Saved Expressions</strong><span class="hint" id="count">0개 표현</span></div><div id="cards" class="cards"></div><div id="empty" class="empty">먼저 Google Sheets에 연결해 주세요.</div><p class="footer">데이터는 Google Sheets에 저장됩니다. 앱을 여러 기기에서 열어도 같은 목록을 불러올 수 있습니다.</p>
</main><div id="flash" class="hidden" role="status"></div>
<script>
(()=>{
'use strict';
const API_URL='https://script.google.com/macros/s/AKfycbwKm9Cc_j1_fHrCpu8cIdt1TbtXUH9RKKAOwf0eN92vOymBAEPGFcIbObEnq5C_XEIlsA/exec';
const $=id=>document.getElementById(id);
let password='',records=[],editing=null,busy=false,sequence=0;
const pending=new Map();
function flash(s){$('flash').textContent=s;$('flash').classList.remove('hidden');clearTimeout(flash.t);flash.t=setTimeout(()=>$('flash').classList.add('hidden'),3000)}
function status(s,cls=''){$('status').textContent=s;$('status').className='status '+cls}
function element(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
function controls(enabled){['new','reload','export','importButton'].forEach(id=>$(id).disabled=!enabled)}
function setBusy(v){busy=v;$('save').disabled=v;$('connect').disabled=v;$('reload').disabled=v}
function allowedOrigin(origin){try{const url=new URL(origin);return url.protocol==='https:'&&(url.hostname==='script.google.com'||url.hostname==='script.googleusercontent.com'||url.hostname.endsWith('.googleusercontent.com'))}catch{return false}}
window.addEventListener('message',event=>{
  if(!allowedOrigin(event.origin))return;
  const data=event.data;if(!data||data.source!=='english-bank-api'||typeof data.requestId!=='string')return;
  const job=pending.get(data.requestId);if(!job)return;
  pending.delete(data.requestId);clearTimeout(job.timeout);job.cleanup();
  if(data.ok)job.resolve(data.data);else job.reject(new Error(data.error||'서버 오류'));
});
// A normal cross-origin fetch is blocked by Apps Script CORS restrictions.
// A hidden form POST + iframe message is used instead.
function api(action,fields={}){
  if(!password)return Promise.reject(new Error('비밀번호를 먼저 입력해 주세요.'));
  const requestId=crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+(++sequence)+'-'+Math.random();
  return new Promise((resolve,reject)=>{
    const iframe=document.createElement('iframe');iframe.name='eb_frame_'+(++sequence);iframe.style.display='none';iframe.setAttribute('aria-hidden','true');
    const form=document.createElement('form');form.method='POST';form.action=API_URL;form.target=iframe.name;form.style.display='none';
    const input=document.createElement('input');input.type='hidden';input.name='payload';input.value=JSON.stringify({action,password,requestId,...fields});form.append(input);
    const cleanup=()=>{form.remove();iframe.remove()};
    const timeout=setTimeout(()=>{pending.delete(requestId);cleanup();reject(new Error('응답 시간 초과. Apps Script 배포 및 응답 설정을 확인해 주세요.'))},25000);
    pending.set(requestId,{resolve,reject,cleanup,timeout});document.body.append(iframe,form);
    try{form.submit()}catch(e){clearTimeout(timeout);pending.delete(requestId);cleanup();reject(e)}
  });
}
async function load(){setBusy(true);status('불러오는 중...');try{const data=await api('list');if(!Array.isArray(data))throw Error('목록 응답 형식이 잘못되었습니다.');records=data;render();controls(true);status('Google Sheets 연결됨','ok')}catch(e){status('연결 실패','bad');flash(e.message);throw e}finally{setBusy(false)}}
$('connect').onclick=async()=>{const value=$('pass').value;if(!value){flash('비밀번호를 입력해 주세요.');return}password=value;$('pass').value='';try{await load()}catch{password='';controls(false)}};
$('reload').onclick=()=>load().catch(()=>{});
function exampleRow(en='',ko=''){
 const row=element('div','example');const head=element('div','row between');const label=element('strong','','예문');const remove=element('button','btn','삭제');remove.type='button';remove.onclick=()=>{row.remove();renumber()};head.append(label,remove);
 const fields=element('div','fields');fields.style.marginTop='10px';const a=element('div'),b=element('div');const al=element('label','','영어 예문 (선택)'),bl=element('label','','한국어 번역 (선택)');const ai=element('textarea','enInput'),bi=element('textarea','koInput');ai.value=en;bi.value=ko;ai.maxLength=2000;bi.maxLength=2000;ai.placeholder='영어 예문';bi.placeholder='한국어 해석';a.append(al,ai);b.append(bl,bi);fields.append(a,b);row.append(head,fields);return row;
}
function renumber(){[...$('examples').children].forEach((row,i)=>row.querySelector('strong').textContent='예문 '+(i+1));$('addExample').disabled=$('examples').children.length>=3}
function addExample(en='',ko=''){if($('examples').children.length>=3)return;$('examples').append(exampleRow(en,ko));renumber()}
function editor(item=null){editing=item?.id||null;$('editorTitle').textContent=item?'표현 수정':'새 표현 추가';$('phrase').value=item?.phrase||'';$('meaning').value=item?.meaning||'';$('examples').replaceChildren();(item?.examples||[]).forEach(x=>addExample(x.en,x.ko));renumber();$('editor').classList.remove('hidden');$('editor').scrollIntoView({behavior:'smooth',block:'start'});$('phrase').focus()}
function closeEditor(){editing=null;$('editor').classList.add('hidden')}
$('new').onclick=()=>editor();$('cancel').onclick=closeEditor;$('addExample').onclick=()=>addExample();
$('entryForm').onsubmit=async e=>{e.preventDefault();if(busy)return;const phrase=$('phrase').value.trim(),meaning=$('meaning').value.trim();if(!phrase)return;const examples=[...$('examples').children].map(row=>({en:row.querySelector('.enInput').value.trim(),ko:row.querySelector('.koInput').value.trim()})).filter(x=>x.en||x.ko);const record={phrase,meaning,examples};if(editing)record.id=editing;setBusy(true);try{await api(editing?'update':'create',{record});closeEditor();await load();flash('Google Sheets에 저장했어요.')}catch(err){flash(err.message)}finally{setBusy(false)}};
function render(){const q=$('search').value.trim().toLowerCase();const shown=records.filter(r=>[r.phrase,r.meaning,...(r.examples||[]).flatMap(x=>[x.en,x.ko])].some(x=>String(x||'').toLowerCase().includes(q)));$('cards').replaceChildren();$('count').textContent=`${records.length}개 표현 / 검색 ${shown.length}개`;$('empty').classList.toggle('hidden',shown.length>0);$('empty').textContent=records.length?'검색 결과가 없어요.':'저장된 표현이 없어요. 새 표현을 추가해 보세요.';
 shown.forEach(r=>{const card=element('article','card');card.append(element('span','tag','EXPRESSION'),element('h3','',r.phrase));if(r.meaning)card.append(element('p','meaning',r.meaning));(r.examples||[]).forEach((ex,i)=>{const sample=element('div','sample');sample.append(element('span','tag','EXAMPLE '+String(i+1).padStart(2,'0')));if(ex.en)sample.append(element('p','en',ex.en));if(ex.ko)sample.append(element('p','ko',ex.ko));card.append(sample)});const actions=element('div','actions row');const edit=element('button','btn','수정'),del=element('button','btn danger','삭제');edit.onclick=()=>editor(r);del.onclick=async()=>{if(!confirm('“'+r.phrase+'” 표현을 삭제할까요?'))return;del.disabled=true;try{await api('delete',{id:r.id});await load();flash('삭제했어요.')}catch(e){flash(e.message)}finally{del.disabled=false}};actions.append(edit,del);card.append(actions);$('cards').append(card)})}
$('search').oninput=render;
$('export').onclick=()=>{const body={app:'My English Bank',version:1,exportedAt:new Date().toISOString(),records};const url=URL.createObjectURL(new Blob([JSON.stringify(body,null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='english-bank-backup-'+new Date().toISOString().slice(0,10)+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('importButton').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>10*1024*1024)throw Error('최대 10MB 파일만 가능합니다.');const data=JSON.parse(await file.text());if(data.app!=='My English Bank'||!Array.isArray(data.records))throw Error('올바른 백업 파일이 아닙니다.');const items=data.records.filter(x=>x&&typeof x.phrase==='string'&&x.phrase.trim()).map(x=>({phrase:x.phrase,meaning:String(x.meaning||''),examples:Array.isArray(x.examples)?x.examples.slice(0,3).map(a=>({en:String(a.en||''),ko:String(a.ko||'')})):[]}));if(!confirm(`${items.length}개 표현을 Google Sheets에 새 항목으로 추가할까요? 기존 항목은 유지됩니다.`))return;setBusy(true);let done=0;for(const record of items){await api('create',{record});done++}await load();flash(done+'개 표현을 가져왔어요.')}catch(err){flash(err.message+' (이미 저장된 항목은 유지됩니다.)')}finally{setBusy(false);e.target.value=''}};
})();
</script>
</body>
</html>
