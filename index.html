<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#121a2b">
  <title>My English Bank</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}header{background:#121a2b;color:white;padding:30px max(20px,calc((100% - 960px)/2)) 28px}header small{color:#91b0ee;text-transform:uppercase;letter-spacing:.16em;font-weight:800}header h1{margin:8px 0;font-size:clamp(29px,5vw,42px)}header p{color:#acb7ca;margin:0}main{max-width:960px;margin:0 auto;padding:24px 18px 80px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}.toolbar input{flex:1;min-width:200px}.btn{border:0;border-radius:12px;padding:12px 17px;font-weight:750;background:#e8edf8;color:#2b416d}.btn.primary{background:#4b67e8;color:white}.btn.danger{background:#fff0f0;color:#b02e3d}.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #9db0ff;outline-offset:2px}input,textarea{width:100%;border:1px solid #d9dfeb;border-radius:12px;background:white;padding:12px 14px;color:#172033;font-size:16px}textarea{resize:vertical;min-height:75px}label{display:block;font-size:13px;font-weight:750;color:#57657e;margin-bottom:7px}.panel,.entry{border:1px solid #e1e6ef;background:white;box-shadow:0 8px 26px rgba(25,39,72,.05);border-radius:20px}.panel{padding:22px;margin-bottom:20px}.panel h2{margin:0 0 16px;font-size:20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.wide{grid-column:1/-1}.example-input{padding:16px 0;border-top:1px solid #e9edf3}.example-input:first-child{border-top:0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row.end{justify-content:flex-end}.row.between{justify-content:space-between}.example-input .fields{margin-top:10px}.helper{color:#73819a;font-size:13px}.count{color:#57657e;font-weight:700}.entries{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}.entry{padding:22px;min-width:0}.entry h3{margin:10px 0 4px;font-size:23px;overflow-wrap:anywhere}.meaning{color:#677690;font-size:15px;margin:0 0 20px;white-space:pre-wrap}.badge{background:#edf1fe;border-radius:99px;padding:5px 9px;font-size:11px;color:#4960b7;font-weight:800}.sample{border-top:1px solid #e9edf3;padding:15px 0 0;margin-top:14px}.sample .number{font-size:11px;letter-spacing:.1em;color:#8b96aa;font-weight:800}.sample .en{margin:7px 0 5px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55;font-weight:650}.sample .ko{margin:0;color:#69788f;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:flex;gap:8px;margin-top:20px}.actions button{font-size:13px;padding:9px 12px}.empty{text-align:center;border:2px dashed #dce3ef;border-radius:18px;padding:48px 20px;color:#76839b}.hidden{display:none!important}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#172033;color:white;border-radius:12px;padding:12px 20px;box-shadow:0 10px 30px #0003;z-index:10}.footnote{font-size:12px;color:#8190a7;margin-top:18px} @media(max-width:600px){.fields{grid-template-columns:1fr}.panel{padding:18px}.toolbar .btn{flex:1}.entry{padding:18px}}
  </style>
</head>
<body>
<header><small>Personal Vocabulary Journal</small><h1>My English Bank</h1></header>
<main>
  <div class="toolbar"><input id="search" type="search" placeholder="표현, 뜻, 예문 검색" aria-label="저장된 표현 검색"><button class="btn primary" id="toggleForm">+ 새 표현 추가</button><button class="btn" id="export">백업 저장</button><button class="btn" id="importBtn">백업 불러오기</button><input type="file" id="importFile" accept="application/json,.json" class="hidden"></div>
  <section id="editor" class="panel hidden"><h2 id="formTitle">새 표현 등록</h2><form id="entryForm"><div class="fields"><div><label for="phrase">영어 단어·숙어 *</label><input id="phrase" required placeholder="예: On my own merits" maxlength="250"></div><div><label for="meaning">한국어 뜻 (선택)</label><input id="meaning" placeholder="예: 내 자신의 능력으로" maxlength="500"></div></div><div id="examples" style="margin-top:20px"></div><div class="row between"><button type="button" class="btn" id="addExample">+ 예문 추가 (최대 3개)</button><span class="helper">예문과 번역 모두 선택 사항</span></div><div class="row end" style="margin-top:20px"><button type="button" class="btn" id="cancel">취소</button><button type="submit" class="btn primary">저장하기</button></div></form></section>
  <div class="row between" style="margin:18px 2px"><strong>Saved Expressions</strong><span class="count" id="count">0개 표현</span></div><div class="entries" id="entries"></div><div id="empty" class="empty">아직 저장된 표현이 없어요.<br>첫 번째 단어·숙어를 추가해 보세요.</div>
  <p class="footnote">현재 버전은 이 기기의 브라우저에 자동 저장됩니다. 브라우저 데이터 삭제나 기기 변경에 대비해 ‘백업 저장’을 사용하세요. 다른 기기와 자동 동기화되지는 않습니다.</p>
</main><div id="toast" class="toast hidden" role="status"></div>
<script>
(()=>{
  'use strict';
  const KEY='my-english-bank-v1';const $=id=>document.getElementById(id);
  let records=[];let editing=null;let nextCount=0;
  try{const parsed=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(parsed))records=parsed.filter(validRecord)}catch{alert('저장 데이터를 읽지 못했습니다. 백업 파일이 있다면 복원할 수 있습니다.')}
  function validRecord(x){return x&&typeof x.id==='string'&&typeof x.phrase==='string'&&typeof x.meaning==='string'&&Array.isArray(x.examples)&&x.examples.length<=3&&x.examples.every(e=>e&&typeof e.en==='string'&&typeof e.ko==='string')}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(records));return true}catch{alert('저장 공간에 문제가 생겼습니다. 백업을 다운로드해 주세요.');return false}}
  function message(t){$('toast').textContent=t;$('toast').classList.remove('hidden');clearTimeout(message.t);message.t=setTimeout(()=>$('toast').classList.add('hidden'),2600)}
  function node(tag,cls,content){const n=document.createElement(tag);if(cls)n.className=cls;if(content!==undefined)n.textContent=content;return n}
  function exampleRow(en='',ko=''){const i=++nextCount;const row=node('div','example-input');row.innerHTML=`<div class="row between"><strong>예문 <span class="ordinal"></span></strong><button type="button" class="btn removeExample" aria-label="이 예문 삭제">삭제</button></div><div class="fields"><div><label for="en${i}">영어 예문 (선택)</label><textarea id="en${i}" class="en" placeholder="영어 문장을 직접 입력"></textarea></div><div><label for="ko${i}">한국어 번역 (선택)</label><textarea id="ko${i}" class="ko" placeholder="한국어 해석을 직접 입력"></textarea></div></div>`;row.querySelector('.en').value=en;row.querySelector('.ko').value=ko;row.querySelector('.removeExample').addEventListener('click',()=>{row.remove();renumber()});return row}
  function renumber(){[...$('examples').children].forEach((e,i)=>e.querySelector('.ordinal').textContent=i+1);$('addExample').disabled=$('examples').children.length>=3}
  function addExample(en='',ko=''){if($('examples').children.length>=3)return;$('examples').append(exampleRow(en,ko));renumber()}
  function openEditor(item=null){editing=item?.id||null;$('formTitle').textContent=item?'표현 수정':'새 표현 등록';$('phrase').value=item?.phrase||'';$('meaning').value=item?.meaning||'';$('examples').replaceChildren();(item?.examples||[]).forEach(e=>addExample(e.en,e.ko));$('editor').classList.remove('hidden');$('phrase').focus();$('editor').scrollIntoView({behavior:'smooth',block:'start'})}
  function closeEditor(){$('editor').classList.add('hidden');editing=null}
  $('toggleForm').onclick=()=>openEditor();$('cancel').onclick=closeEditor;$('addExample').onclick=()=>addExample();
  $('entryForm').onsubmit=e=>{e.preventDefault();const phrase=$('phrase').value.trim(),meaning=$('meaning').value.trim();const examples=[...$('examples').children].map(row=>({en:row.querySelector('.en').value.trim(),ko:row.querySelector('.ko').value.trim()})).filter(x=>x.en||x.ko);if(!phrase){message('영어 단어·숙어를 입력해 주세요.');return}const wasEditing=Boolean(editing);const existing=records.find(x=>x.id===editing);const item={id:editing||crypto.randomUUID(),phrase,meaning,examples,createdAt:existing?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};const next=editing?records.map(x=>x.id===editing?item:x):[item,...records];const old=records;records=next;if(!save()){records=old;return}closeEditor();render();message(wasEditing?'수정했어요.':'저장했어요.')};
  function render(){const q=$('search').value.trim().toLocaleLowerCase();const shown=records.filter(r=>[r.phrase,r.meaning,...r.examples.flatMap(e=>[e.en,e.ko])].some(t=>t.toLocaleLowerCase().includes(q)));$('entries').replaceChildren();$('count').textContent=`${records.length}개 표현 · 검색 결과 ${shown.length}개`;$('empty').classList.toggle('hidden',shown.length>0);$('empty').textContent=records.length?'검색 결과가 없어요.':'아직 저장된 표현이 없어요. 첫 번째 표현을 추가해 보세요.';shown.forEach(r=>{const card=node('article','entry');const top=node('div','row between');top.append(node('span','badge','EXPRESSION'),node('span','helper',new Date(r.createdAt||Date.now()).toLocaleDateString('ko-KR')));card.append(top,node('h3','',r.phrase));if(r.meaning)card.append(node('p','meaning',r.meaning));r.examples.forEach((s,i)=>{const sec=node('div','sample');sec.append(node('div','number',`EXAMPLE ${String(i+1).padStart(2,'0')}`));if(s.en)sec.append(node('p','en',s.en));if(s.ko)sec.append(node('p','ko',s.ko));card.append(sec)});const acts=node('div','actions');const edit=node('button','btn','수정'),del=node('button','btn danger','삭제');edit.onclick=()=>openEditor(r);del.onclick=()=>{if(!confirm(`“${r.phrase}” 표현을 삭제할까요?`))return;const old=records;records=records.filter(x=>x.id!==r.id);if(!save()){records=old;return}render();message('삭제했어요.')};acts.append(edit,del);card.append(acts);$('entries').append(card)})}
  $('search').addEventListener('input',render);
  $('export').onclick=()=>{const blob=new Blob([JSON.stringify({app:'My English Bank',version:1,exportedAt:new Date().toISOString(),records},null,2)],{type:'application/json'});const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=`english-bank-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
  $('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>10*1024*1024)throw Error('10MB 이하 파일만 불러올 수 있습니다.');const data=JSON.parse(await file.text());if(data.app!=='My English Bank'||!Array.isArray(data.records)||!data.records.every(validRecord))throw Error('올바른 백업 파일이 아닙니다.');if(!confirm(`백업의 ${data.records.length}개 표현을 현재 데이터와 합칠까요? 동일한 ID는 백업으로 대체합니다.`))return;const map=new Map(records.map(r=>[r.id,r]));data.records.forEach(r=>map.set(r.id,r));const old=records;records=[...map.values()];if(!save()){records=old;return}render();message('백업을 불러왔어요.')}catch(err){alert(err.message||'백업 파일을 읽을 수 없습니다.')}finally{e.target.value=''}};
  render();
})();
</script>
</body></html>
