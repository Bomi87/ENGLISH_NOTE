<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111a2c">
<title>My English Bank — Google Sheets</title>
<style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#19243a;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}header{background:#111a2c;color:#fff;padding:28px max(18px,calc((100% - 1168px)/2))}header small{color:#a9bcff;letter-spacing:.12em;font-weight:800}h1{margin:6px 0;font-size:clamp(30px,5vw,42px)}header p{color:#aab8cc;margin:0}main{max-width:1200px;margin:auto;padding:22px 16px 80px}.panel,.card{background:#fff;border:1px solid #e2e7f0;border-radius:20px;box-shadow:0 7px 20px #15213a0b}.panel{padding:20px;margin-bottom:20px}.panel h2{margin:0 0 15px;font-size:20px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.end{justify-content:flex-end}.toolbar{margin:20px 0}.toolbar input{flex:1;min-width:180px}.btn{border:0;border-radius:12px;padding:11px 15px;background:#e9eef8;color:#30436e;font-weight:750}.btn.primary{background:#4d67df;color:white}.btn.danger{background:#fff0f1;color:#b23442}.btn:disabled{opacity:.5;cursor:wait}input,textarea{width:100%;background:#fff;border:1px solid #d9e0ec;border-radius:12px;padding:12px;font-size:16px;color:#19243a}input:focus,textarea:focus{outline:3px solid #c0cdff}textarea{min-height:74px;resize:vertical}label{display:block;font-size:13px;font-weight:700;color:#62718b;margin:0 0 6px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.example{padding:15px 0;border-top:1px solid #e8edf4}.examples{margin-top:18px}.hint{color:#7886a0;font-size:12px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.card{padding:21px;min-width:0}.card h3{font-size:22px;margin:7px 0;overflow-wrap:anywhere}.meaning{color:#697790;white-space:pre-wrap}.sample{border-top:1px solid #edf0f5;margin-top:14px;padding-top:14px}.tag{color:#697ad0;font-size:11px;font-weight:800;letter-spacing:.1em}.en{font-weight:700;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}.ko{color:#697790;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}.actions{margin-top:18px}.hidden{display:none!important}.empty{border:2px dashed #d9e1ee;padding:42px 18px;text-align:center;border-radius:17px;color:#76849b}.status{font-size:12px;font-weight:700;color:#7886a0}.status.ok{color:#168361}.status.bad{color:#b23442}.footer{margin-top:20px;font-size:12px;color:#77869c}#flash{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#172139;color:#fff;padding:12px 20px;border-radius:12px;z-index:5;max-width:calc(100vw - 30px)}@media(max-width:700px){.cards{grid-template-columns:minmax(0,1fr)}}@media(max-width:600px){.fields{grid-template-columns:1fr}.panel{padding:16px}.toolbar button{flex:1}}
/* iOS Safari: prevent input-focus auto zoom (reference app uses 17px). */
@media (max-width: 768px) {
  input:not([type="hidden"]), textarea, select {
    font-size: 16px !important;
  }
}
/* Bookmark and compact summary views */
.card{position:relative;cursor:pointer;scroll-margin-top:20px}.card.is-bookmarked{border:2px solid #4d67df;background:#f1f4ff;box-shadow:0 0 0 3px #4d67df20}.bookmark-label{display:none;color:#4059cb;font-size:12px;font-weight:800;margin-bottom:8px}.is-bookmarked .bookmark-label{display:block}.card:focus-visible{outline:3px solid #4d67df;outline-offset:3px}.view-nav{margin:16px 0;gap:8px}.view-nav .btn[aria-pressed="true"]{background:#4d67df;color:white}.bookmark-info{font-size:13px;color:#62718b;overflow-wrap:anywhere}.summary-table{width:100%;table-layout:fixed;border-collapse:collapse;background:white;border:1px solid #e2e7f0}.summary-table th,.summary-table td{text-align:left;padding:10px 12px;border-bottom:1px solid #e2e7f0;overflow-wrap:anywhere;vertical-align:top}.summary-table th{background:#e9eef8;color:#30436e}.summary-table th:first-child{width:40%}.summary-table button{border:0;background:none;color:#19243a;font:inherit;font-weight:700;text-align:left;padding:0;overflow-wrap:anywhere;cursor:pointer}.summary-table tr.is-bookmarked td,.summary-table tr.is-selected td{background:#f1f4ff}.summary-table tr.is-bookmarked .summary-phrase:before{content:'🔖 ';}.summary-table button:focus-visible{outline:2px solid #4d67df}main>*{min-width:0}.toolbar input{min-width:0;flex-basis:180px}@media(max-width:600px){.summary-table th,.summary-table td{padding:9px 8px;font-size:13px}.view-nav .btn{padding:10px}}
/* Floating top navigation, clear of mobile safe areas. */
#backToTop{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));z-index:10;border:1px solid #ccd6fc;border-radius:999px;padding:12px 17px;min-height:46px;background:#405bd5;color:#fff;font:inherit;font-size:14px;font-weight:750;box-shadow:0 5px 18px #17213930;cursor:pointer}#backToTop:hover{background:#3049bd}#backToTop:focus-visible{outline:3px solid #91a4ff;outline-offset:3px}#backToTop[hidden]{display:none!important}@media(max-width:600px){#backToTop{right:max(12px,env(safe-area-inset-right));padding:11px 14px;font-size:13px}}
/* Selection is temporary; bookmark remains independent. */
.card.is-selected{border:2px solid #4d67df;background:#f1f4ff;box-shadow:0 0 0 3px #4d67df20}.card.is-bookmarked{border-color:#4d67df}.card{touch-action:pan-y;-webkit-touch-callout:none}.card.is-pressing{box-shadow:inset 0 0 0 2px #758be5}#summaryView{touch-action:pan-y}
.summary-table tbody tr{cursor:pointer;touch-action:pan-y;-webkit-touch-callout:none}.summary-phrase{font-weight:700}.summary-table tbody tr:focus-visible{outline:2px solid #4d67df;outline-offset:-2px}.summary-table tr.is-pressing td{background:#f1f4ff}
/* Selection and bookmarks: preserve original background; blue outline only. */
.card.is-selected,.card.is-bookmarked{background:#fff;border:1px solid #e2e7f0;outline:2px solid #4d67df;outline-offset:-1px;box-shadow:0 7px 20px #15213a0b}.card.is-pressing{box-shadow:0 7px 20px #15213a0b}
.summary-table tr.is-selected td,.summary-table tr.is-bookmarked td,.summary-table tr.is-pressing td{background:#fff}.summary-table tr.is-selected,.summary-table tr.is-bookmarked{outline:2px solid #4d67df;outline-offset:-2px}
</style>
</head>
<body>
<header><small>PERSONAL VOCABULARY JOURNAL</small><h1>My English Bank</h1></header>
<main>
 <section class="panel" id="loginPanel"><div class="row between"><strong>Google Sheets 동기화</strong><span id="status" class="status">연결 중...</span></div></section>
 <div class="toolbar row"><input id="search" type="search" placeholder="단어, 뜻, 예문 검색" aria-label="검색"><button id="new" class="btn primary" disabled>+ 새 표현</button><button id="reload" class="btn" disabled>새로고침</button></div>
 <nav class="row view-nav" aria-label="보기 선택"><button id="viewCards" type="button" class="btn" aria-pressed="true">카드 보기</button><button id="viewSummary" type="button" class="btn" aria-pressed="false">Summary · 단어 / 뜻</button><button id="goBookmark" type="button" class="btn">🔖 책갈피로 이동</button><button id="clearBookmark" type="button" class="btn">책갈피 해제</button></nav><p id="bookmarkInfo" class="bookmark-info" role="status"></p>
 <section id="editor" class="panel hidden"><h2 id="editorTitle">새 표현</h2><form id="entryForm"><div class="fields"><div><label for="phrase">영어 단어·숙어 *</label><input id="phrase" required maxlength="250" placeholder="예: On my own merits"></div><div><label for="meaning">한국어 뜻 (선택)</label><input id="meaning" maxlength="500" placeholder="예: 내 실력으로"></div></div><div id="examples" class="examples"></div><div class="row between"><button id="addExample" class="btn" type="button">+ 예문 추가 (최대 3개)</button><span class="hint">영어 예문·한국어 번역 모두 선택</span></div><div class="row end" style="margin-top:18px"><button id="cancel" type="button" class="btn">취소</button><button id="save" type="submit" class="btn primary">저장하기</button></div></form></section>
 <div class="row between" style="margin:20px 2px"><strong>Saved Expressions</strong><span class="hint" id="count">0개 표현</span></div><div id="cards" class="cards"></div><section id="summaryView" class="hidden" aria-label="단어와 뜻 요약"><table class="summary-table"><thead><tr><th scope="col">영어 단어·숙어 (B열)</th><th scope="col">한국어 뜻 (C열)</th></tr></thead><tbody id="summaryBody"></tbody></table></section><div id="empty" class="empty">먼저 Google Sheets에 연결해 주세요.</div><p class="footer">데이터는 Google Sheets에 저장됩니다. 앱을 여러 기기에서 열어도 같은 목록을 불러올 수 있습니다.</p>
</main><div id="flash" class="hidden" role="status"></div>
<script>
(()=>{
'use strict';
const API_URL='https://script.google.com/macros/s/AKfycbwKm9Cc_j1_fHrCpu8cIdt1TbtXUH9RKKAOwf0eN92vOymBAEPGFcIbObEnq5C_XEIlsA/exec';
const $=id=>document.getElementById(id);
let records=[],editing=null,busy=false,sequence=0;
const pending=new Map();
const BOOKMARK_KEY='english-bank-bookmark-v1';
let selectedId=null,bookmarkId=null,initialRestoreDone=false;
try{bookmarkId=localStorage.getItem(BOOKMARK_KEY)||null}catch{}
function recordKey(r){return String(r.id)}
function updateBookmarkUI(){
 const marked=records.find(r=>recordKey(r)===bookmarkId);
 document.querySelectorAll('[data-record-id]').forEach(n=>{const selected=n.dataset.recordId===bookmarkId;n.classList.toggle('is-bookmarked',selected);n.classList.toggle('is-selected',n.dataset.recordId===selectedId);if(n.classList.contains('card'))n.setAttribute('aria-label',n.dataset.phrase+(selected?' · 책갈피 선택됨':' · 짧게 눌러 선택, 꾹 눌러 책갈피 설정'))});
 $('bookmarkInfo').textContent=marked?'🔖 책갈피: '+marked.phrase+' · 카드를 꾹 누르면 책갈피가 변경됩니다.':'짧게 누르면 선택, 꾹 누르면 책갈피로 저장됩니다. 다음 접속 시 해당 위치로 이동합니다.';
 $('goBookmark').disabled=!marked;$('clearBookmark').disabled=!bookmarkId;
}
function setBookmark(r){const removing=bookmarkId===recordKey(r);bookmarkId=removing?null:recordKey(r);let saved=true;try{if(bookmarkId)localStorage.setItem(BOOKMARK_KEY,bookmarkId);else localStorage.removeItem(BOOKMARK_KEY)}catch{saved=false}updateBookmarkUI();flash(saved?(removing?'책갈피를 해제했어요.':'책갈피를 저장했어요.'):'브라우저 저장이 제한되어 이번 접속에서만 변경됩니다.')}
function scrollToRecord(id){const card=[...$('cards').children].find(n=>n.dataset.recordId===id);if(card)requestAnimationFrame(()=>card.scrollIntoView({block:'start',behavior:'auto'}))}
function showView(summary){$('cards').classList.toggle('hidden',summary);$('summaryView').classList.toggle('hidden',!summary);$('viewCards').setAttribute('aria-pressed',String(!summary));$('viewSummary').setAttribute('aria-pressed',String(summary));if(summary)closeEditor()}
function attachCardGestures(card,r){
 let timer=null,start=null,suppressUntil=0;
 const cancel=()=>{clearTimeout(timer);timer=null;card.classList.remove('is-pressing')};
 const select=()=>{selectedId=recordKey(r);updateBookmarkUI()};
 card.addEventListener('pointerdown',e=>{
  if(!e.isPrimary||e.button!==0||e.target.closest('button,a,input,textarea'))return;
  cancel();start={x:e.clientX,y:e.clientY,id:e.pointerId};card.classList.add('is-pressing');
  timer=setTimeout(()=>{timer=null;card.classList.remove('is-pressing');suppressUntil=Date.now()+1200;selectedId=recordKey(r);setBookmark(r)},600);
 });
 card.addEventListener('pointermove',e=>{if(start&&Math.hypot(e.clientX-start.x,e.clientY-start.y)>10){cancel();suppressUntil=Date.now()+500}});
 card.addEventListener('pointerup',()=>{cancel();start=null});
 card.addEventListener('pointercancel',()=>{cancel();start=null;suppressUntil=Date.now()+500});
 card.addEventListener('pointerleave',cancel);
 card.addEventListener('contextmenu',e=>{if(!e.target.closest('button,a,input,textarea'))e.preventDefault()});
 card.onclick=e=>{if(Date.now()<suppressUntil||e.target.closest('button,a,input,textarea')||window.getSelection()?.toString())return;select()};
 card.onkeydown=e=>{if(e.target!==card)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();if(e.shiftKey){setBookmark(r)}else select()}};
}
// Horizontal touch swipes switch views; vertical movement cancels the gesture.
let swipeStart=null;
document.querySelector('main').addEventListener('touchstart',e=>{
 if(e.touches.length!==1||e.target.closest('button,a,input,textarea,select,#editor')){swipeStart=null;return}
 const t=e.touches[0];swipeStart={x:t.clientX,y:t.clientY,time:Date.now()};
},{passive:true});
document.querySelector('main').addEventListener('touchmove',e=>{if(!swipeStart)return;if(e.touches.length!==1){swipeStart=null;return}const t=e.touches[0];if(Math.abs(t.clientY-swipeStart.y)>35)swipeStart=null},{passive:true});
document.querySelector('main').addEventListener('touchend',e=>{
 if(!swipeStart)return;const start=swipeStart;swipeStart=null;const t=e.changedTouches[0];if(!t)return;
 const dx=t.clientX-start.x,dy=t.clientY-start.y;
 if(Date.now()-start.time>550||Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.8)return;
 const summary=!$('summaryView').classList.contains('hidden');
 if(dx<0&&!summary)showView(true);else if(dx>0&&summary)showView(false);
},{passive:true});
document.querySelector('main').addEventListener('touchcancel',()=>{swipeStart=null},{passive:true});
$('viewCards').onclick=()=>showView(false);$('viewSummary').onclick=()=>showView(true);
$('goBookmark').onclick=()=>{if(!bookmarkId)return;$('search').value='';render();showView(false);scrollToRecord(bookmarkId)};
$('clearBookmark').onclick=()=>{bookmarkId=null;try{localStorage.removeItem(BOOKMARK_KEY)}catch{}updateBookmarkUI()};
function flash(s){$('flash').textContent=s;$('flash').classList.remove('hidden');clearTimeout(flash.t);flash.t=setTimeout(()=>$('flash').classList.add('hidden'),3000)}
function status(s,cls=''){$('status').textContent=s;$('status').className='status '+cls}
function element(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
function controls(enabled){['new','reload'].forEach(id=>$(id).disabled=!enabled)}
function setBusy(v){busy=v;$('save').disabled=v;$('reload').disabled=v}
function allowedOrigin(origin){try{const url=new URL(origin);return url.protocol==='https:'&&(url.hostname==='script.google.com'||url.hostname==='script.googleusercontent.com'||url.hostname.endsWith('.googleusercontent.com'))}catch{return false}}
window.addEventListener('message',event=>{
  if(!allowedOrigin(event.origin))return;
  const data=event.data;if(!data||data.source!=='english-bank-api'||typeof data.requestId!=='string')return;
  const job=pending.get(data.requestId);if(!job)return;
  pending.delete(data.requestId);clearTimeout(job.timeout);job.cleanup();
  if(data.ok)job.resolve(data.data);else job.reject(new Error(data.error||'서버 오류'));
});
// A normal cross-origin fetch is blocked by Apps Script CORS restrictions.
// A hidden form POST + iframe message is used instead.
function api(action,fields={}){
  const requestId=crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+(++sequence)+'-'+Math.random();
  return new Promise((resolve,reject)=>{
    const iframe=document.createElement('iframe');iframe.name='eb_frame_'+(++sequence);iframe.style.display='none';iframe.setAttribute('aria-hidden','true');
    const form=document.createElement('form');form.method='POST';form.action=API_URL;form.target=iframe.name;form.style.display='none';
    const input=document.createElement('input');input.type='hidden';input.name='payload';input.value=JSON.stringify({action,requestId,...fields});form.append(input);
    const cleanup=()=>{form.remove();iframe.remove()};
    const timeout=setTimeout(()=>{pending.delete(requestId);cleanup();reject(new Error('응답 시간 초과. Apps Script 배포 및 응답 설정을 확인해 주세요.'))},25000);
    pending.set(requestId,{resolve,reject,cleanup,timeout});document.body.append(iframe,form);
    try{form.submit()}catch(e){clearTimeout(timeout);pending.delete(requestId);cleanup();reject(e)}
  });
}
async function load(){setBusy(true);status('불러오는 중...');try{const data=await api('list');if(!Array.isArray(data))throw Error('목록 응답 형식이 잘못되었습니다.');records=data;render();if(!initialRestoreDone){initialRestoreDone=true;if(bookmarkId)scrollToRecord(bookmarkId)}controls(true);status('Google Sheets 연결됨','ok')}catch(e){status('연결 실패: '+e.message,'bad');flash(e.message);throw e}finally{setBusy(false);$('reload').disabled=false}}
load().catch(()=>{$('new').disabled=true});
$('reload').onclick=()=>load().catch(()=>{});
function exampleRow(en='',ko=''){
 const row=element('div','example');const head=element('div','row between');const label=element('strong','','예문');const remove=element('button','btn','삭제');remove.type='button';remove.onclick=()=>{row.remove();renumber()};head.append(label,remove);
 const fields=element('div','fields');fields.style.marginTop='10px';const a=element('div'),b=element('div');const al=element('label','','영어 예문 (선택)'),bl=element('label','','한국어 번역 (선택)');const ai=element('textarea','enInput'),bi=element('textarea','koInput');ai.value=en;bi.value=ko;ai.maxLength=2000;bi.maxLength=2000;ai.placeholder='영어 예문';bi.placeholder='한국어 해석';a.append(al,ai);b.append(bl,bi);fields.append(a,b);row.append(head,fields);return row;
}
function renumber(){[...$('examples').children].forEach((row,i)=>row.querySelector('strong').textContent='예문 '+(i+1));$('addExample').disabled=$('examples').children.length>=3}
function addExample(en='',ko=''){if($('examples').children.length>=3)return;$('examples').append(exampleRow(en,ko));renumber()}
function editor(item=null){editing=item?.id||null;$('editorTitle').textContent=item?'표현 수정':'새 표현 추가';$('phrase').value=item?.phrase||'';$('meaning').value=item?.meaning||'';$('examples').replaceChildren();(item?.examples||[]).forEach(x=>addExample(x.en,x.ko));renumber();$('editor').classList.remove('hidden');$('editor').scrollIntoView({behavior:'smooth',block:'start'});$('phrase').focus()}
function closeEditor(){editing=null;$('editor').classList.add('hidden')}
$('new').onclick=()=>editor();$('cancel').onclick=closeEditor;$('addExample').onclick=()=>addExample();
$('entryForm').onsubmit=async e=>{e.preventDefault();if(busy)return;const phrase=$('phrase').value.trim(),meaning=$('meaning').value.trim();if(!phrase)return;const examples=[...$('examples').children].map(row=>({en:row.querySelector('.enInput').value.trim(),ko:row.querySelector('.koInput').value.trim()})).filter(x=>x.en||x.ko);const record={phrase,meaning,examples};if(editing)record.id=editing;setBusy(true);try{await api(editing?'update':'create',{record});closeEditor();await load();flash('Google Sheets에 저장했어요.')}catch(err){flash(err.message)}finally{setBusy(false)}};
function render(){const q=$('search').value.trim().toLowerCase();const shown=records.filter(r=>[r.phrase,r.meaning,...(r.examples||[]).flatMap(x=>[x.en,x.ko])].some(x=>String(x||'').toLowerCase().includes(q)));$('cards').replaceChildren();$('count').textContent=`${records.length}개 표현 / 검색 ${shown.length}개`;$('empty').classList.toggle('hidden',shown.length>0);$('empty').textContent=records.length?'검색 결과가 없어요.':'저장된 표현이 없어요. 새 표현을 추가해 보세요.';
 shown.forEach(r=>{const card=element('article','card');card.dataset.recordId=recordKey(r);card.dataset.phrase=r.phrase;card.tabIndex=0;card.append(element('span','bookmark-label','🔖 책갈피 선택됨'));attachCardGestures(card,r);card.append(element('h3','',r.phrase));if(r.meaning)card.append(element('p','meaning',r.meaning));(r.examples||[]).forEach((ex,i)=>{const sample=element('div','sample');if(ex.en)sample.append(element('p','en',ex.en));if(ex.ko)sample.append(element('p','ko',ex.ko));card.append(sample)});const actions=element('div','actions row');const edit=element('button','btn','수정'),del=element('button','btn danger','삭제');edit.onclick=()=>{if(confirm('“'+r.phrase+'” 표현을 수정할까요?'))editor(r)};del.onclick=async()=>{if(!confirm('“'+r.phrase+'” 표현을 삭제할까요?'))return;del.disabled=true;try{await api('delete',{id:r.id});await load();flash('삭제했어요.')}catch(e){flash(e.message)}finally{del.disabled=false}};actions.append(edit,del);card.append(actions);$('cards').append(card)});
 $('summaryBody').replaceChildren();shown.forEach(r=>{const row=element('tr');row.dataset.recordId=recordKey(r);row.dataset.phrase=r.phrase;row.tabIndex=0;row.setAttribute('aria-label',r.phrase+' · 짧게 눌러 선택, 꾹 눌러 책갈피 설정');const phrase=element('td'),meaning=element('td','',r.meaning||'');phrase.append(element('span','summary-phrase',r.phrase));row.append(phrase,meaning);attachCardGestures(row,r);$('summaryBody').append(row)});updateBookmarkUI();} 
$('search').oninput=render;
})();
</script>
<button id="backToTop" type="button" aria-label="페이지 맨 위로 이동" hidden>↑ 맨 위로</button>
<script>
(()=>{
 const button=document.getElementById('backToTop');
 const update=()=>{button.hidden=window.scrollY<400};
 window.addEventListener('scroll',update,{passive:true});
 window.addEventListener('pageshow',update);
 button.addEventListener('click',()=>{window.scrollTo({top:0,left:0,behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'})});
 update();
})();
</script>
</body>
</html>
